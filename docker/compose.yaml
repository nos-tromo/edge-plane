### edge-plane compose — the federation's single production entry point.
###
### What this project owns:
###   - Caddy (TLS on :443, path routing, forward_auth, X-Auth-User injection)
###   - Authelia (identity; file users, SQLite on edge-state)
###   - External volumes edge-state (Authelia state) and edge-ca (internal CA)
###
### What it does NOT own:
###   - edge-net members' frontends (each app attaches its own with an alias)
###   - Any membership on inference-net / data-net — the gateway can never
###     reach backends or databases directly.
###
### Ports: :443 (+ :80 redirect) and :8443 (Open WebUI's dedicated site —
### it has no sub-path support) are the ONLY published ports in the
### production federation — this is the entry point, the exception that
### proves the no-host-ports rule.

name: edge-plane

# Corporate-proxy defense (docint/Nextext/translator pattern): on hosts where
# the Docker client config injects HTTP_PROXY/HTTPS_PROXY into every
# container, Caddy's Go transport honors them and would send upstream
# requests for the edge-net aliases through the corporate proxy — which
# cannot resolve them. Exempt every alias this gateway proxies to (plus
# whoami, the dev-only echo upstream).
x-no-proxy-env: &no-proxy-env
  NO_PROXY: "authelia,chorus-frontend,docint-frontend,nextext-frontend,translator-frontend,open-webui,grafana,whoami,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "authelia,chorus-frontend,docint-frontend,nextext-frontend,translator-frontend,open-webui,grafana,whoami,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, all capabilities dropped. Caddy re-adds
# NET_BIND_SERVICE below (it binds :443/:80/:8443 in the
# container).
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  default:
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}

services:
  caddy:
    <<: *hardened
    image: docker.io/library/caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    logging: *default-logging
    cap_add:
      - NET_BIND_SERVICE
    # Caddy writes only its CA/cert state (edge-ca:/data), the config
    # autosave (/config) and scratch under /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /config:size=16m
    environment:
      <<: *no-proxy-env
      EDGE_HOST: ${EDGE_HOST:?EDGE_HOST must be set in .env}
      # Unset/empty -> internal CA. For an org-issued cert set EDGE_TLS in
      # .env to the in-container PEM paths (see caddy/Caddyfile and
      # docs/tls-runbook.md).
      EDGE_TLS: ${EDGE_TLS:-internal}
      # Uniform federation UI-language switch for the landing page (en|de,
      # default en). Intentionally unprefixed — same name in every repo.
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-en}
      # Optional support contact rendered on the portal's "report a problem"
      # tile (hidden when unset). Never commit a real value.
      EDGE_SUPPORT_CONTACT: ${EDGE_SUPPORT_CONTACT:-}
    ports:
      - "443:443"
      - "80:80"
      # Dedicated site for Open WebUI (no sub-path support — see
      # caddy/Caddyfile's :8443 block). The one other exception to the
      # no-host-ports rule beyond the main entry point above.
      - "8443:8443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/conf.d:/etc/caddy/conf.d:ro
      - ../landing:/srv/landing:ro
      - ../certs:/etc/caddy/certs:ro
      # File bind + sibling volume, NOT a directory bind with the volume
      # nested inside it: Docker Desktop (VirtioFS, Engine 29 line) silently
      # drops a mount nested inside a bind for compose-created containers
      # (docker/desktop-feedback #264/#279; still reproducible on 4.89.0).
      # /srv/authcode itself is plain rootfs, so nothing nests under a bind.
      - ../authcode/index.html:/srv/authcode/index.html:ro
      - edge-notify:/srv/authcode/notify:ro
      - edge-ca:/data
    networks:
      default:
      edge-net:
    depends_on:
      authelia:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1, not localhost: the admin API binds IPv4-only and this
      # image's busybox wget resolves "localhost" to ::1 first, so the
      # check gets ECONNREFUSED every time despite Caddy being healthy
      # (confirmed reproducible via `docker exec ... wget http://localhost:2019/...`).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  authelia:
    # NNP + cap_drop only: Authelia writes the bind-mounted users.yml
    # (password self-service) and its SQLite on edge-state as the image's
    # default user, so read_only/user: stay deferred (deploy ADR 0001).
    <<: *hardened
    image: docker.io/authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
    logging: *default-logging
    # The image's entrypoint chowns its config and drops to the internal
    # user via su-exec — exactly these three caps, nothing more.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      <<: *no-proxy-env
      EDGE_HOST: ${EDGE_HOST:?EDGE_HOST must be set in .env}
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?set in .env}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?set in .env}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:?set in .env}
    volumes:
      - ../authelia/configuration.yml:/config/configuration.yml:ro
      - ../authelia/users.yml:/config/users.yml
      - edge-state:/data
      - edge-notify:/notify
    networks:
      default:
    expose:
      - "9091"
    restart: unless-stopped

volumes:
  edge-state:
    external: true
  edge-ca:
    external: true
  # Project-scoped, NOT external — holds only short-lived one-time codes,
  # not durable identity state.
  edge-notify:
