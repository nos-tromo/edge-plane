### edge-plane compose — the federation's single production entry point.
###
### What this project owns:
###   - Caddy (TLS on :443, path routing, forward_auth, X-Auth-User injection)
###   - Authelia (identity; file users, SQLite on edge-state)
###   - auth-audit (login attempts and account changes as audit events)
###   - External volumes edge-state (Authelia state), edge-ca (internal CA)
###     and edge-audit-state (auth-audit's export position)
###
### What it does NOT own:
###   - edge-net members' frontends (each app attaches its own with an alias)
###   - Any membership on inference-net / data-net — the gateway can never
###     reach backends or databases directly.
###
### Ports: :443 (+ :80 redirect) and :8443 (Open WebUI's dedicated site —
### it has no sub-path support) are the ONLY published ports in the
### production federation — this is the entry point, the exception that
### proves the no-host-ports rule.

name: edge-plane

# Corporate-proxy defense (docint/Nextext/translator pattern): on hosts where
# the Docker client config injects HTTP_PROXY/HTTPS_PROXY into every
# container, Caddy's Go transport honors them and would send upstream
# requests for the edge-net aliases through the corporate proxy — which
# cannot resolve them. Exempt every alias this gateway proxies to (plus
# whoami, the dev-only echo upstream).
x-no-proxy-env: &no-proxy-env
  NO_PROXY: "authelia,docint-frontend,nextext-frontend,translator-frontend,open-webui,grafana,grafana-audit,whoami,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "authelia,docint-frontend,nextext-frontend,translator-frontend,open-webui,grafana,grafana-audit,whoami,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, all capabilities dropped. Caddy re-adds
# NET_BIND_SERVICE below (it binds :443/:80/:8443 in the
# container).
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  default:
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}

services:
  caddy:
    <<: *hardened
    image: docker.io/library/caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    logging: *default-logging
    cap_add:
      - NET_BIND_SERVICE
    # Caddy writes only its CA/cert state (edge-ca:/data), the config
    # autosave (/config) and scratch under /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /config:size=16m
    environment:
      <<: *no-proxy-env
      EDGE_HOST: ${EDGE_HOST:?EDGE_HOST must be set in .env}
      # Unset/empty -> internal CA. For an org-issued cert set EDGE_TLS in
      # .env to the in-container PEM paths (see caddy/Caddyfile and
      # docs/tls-runbook.md).
      EDGE_TLS: ${EDGE_TLS:-internal}
      # Uniform federation UI-language switch for the landing page (en|de,
      # default en). Intentionally unprefixed — same name in every repo.
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-en}
      # Optional support contact rendered on the portal's "report a problem"
      # tile (hidden when unset). Never commit a real value.
      EDGE_SUPPORT_CONTACT: ${EDGE_SUPPORT_CONTACT:-}
      # Per-upstream edge secrets, sent as X-Edge-Secret (the header_up
      # lines in caddy/Caddyfile). Each value must equal the one in the
      # receiving repo's own .env (obs-plane's for the two Grafana ones);
      # generate with `openssl rand -hex 32`. Empty sends an empty header, which
      # an upstream without its own secret ignores; obs-plane's audit viewer
      # requires its secret and refuses every request without it.
      DOCINT_EDGE_SECRET: ${DOCINT_EDGE_SECRET:-}
      NEXTEXT_EDGE_SECRET: ${NEXTEXT_EDGE_SECRET:-}
      TRANSLATOR_EDGE_SECRET: ${TRANSLATOR_EDGE_SECRET:-}
      OPEN_WEBUI_EDGE_SECRET: ${OPEN_WEBUI_EDGE_SECRET:-}
      GRAFANA_EDGE_SECRET: ${GRAFANA_EDGE_SECRET:-}
      AUDIT_EDGE_SECRET: ${AUDIT_EDGE_SECRET:?AUDIT_EDGE_SECRET must be set in .env (openssl rand -hex 32; same value as obs-plane)}
    ports:
      - "443:443"
      - "80:80"
      # Dedicated site for Open WebUI (no sub-path support — see
      # caddy/Caddyfile's :8443 block). The one other exception to the
      # no-host-ports rule beyond the main entry point above.
      - "8443:8443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/conf.d:/etc/caddy/conf.d:ro
      - ../landing:/srv/landing:ro
      - ../certs:/etc/caddy/certs:ro
      # File bind + sibling volume, NOT a directory bind with the volume
      # nested inside it: Docker Desktop (VirtioFS, Engine 29 line) silently
      # drops a mount nested inside a bind for compose-created containers
      # (docker/desktop-feedback #264/#279; still reproducible on 4.89.0).
      # /srv/authcode itself is plain rootfs, so nothing nests under a bind.
      - ../authcode/index.html:/srv/authcode/index.html:ro
      - edge-notify:/srv/authcode/notify:ro
      - edge-ca:/data
    networks:
      default:
      edge-net:
    depends_on:
      authelia:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1, not localhost: the admin API binds IPv4-only and this
      # image's busybox wget resolves "localhost" to ::1 first, so the
      # check gets ECONNREFUSED every time despite Caddy being healthy
      # (confirmed reproducible via `docker exec ... wget http://localhost:2019/...`).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  authelia:
    # NNP + cap_drop only: Authelia writes the bind-mounted users.yml
    # (password self-service) and its SQLite on edge-state as the image's
    # default user, so read_only/user: stay deferred (deploy ADR 0001).
    <<: *hardened
    image: docker.io/authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
    logging: *default-logging
    # The image's entrypoint chowns its config and drops to the internal
    # user via su-exec — exactly these three caps, nothing more.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      <<: *no-proxy-env
      EDGE_HOST: ${EDGE_HOST:?EDGE_HOST must be set in .env}
      X_AUTHELIA_CONFIG_FILTERS: template
      EDGE_SESSION_EXPIRATION: ${EDGE_SESSION_EXPIRATION:-12h}
      EDGE_SESSION_INACTIVITY: ${EDGE_SESSION_INACTIVITY:-4h}
      EDGE_SESSION_REMEMBER_ME: ${EDGE_SESSION_REMEMBER_ME:-2M}
      # Policy for every protected route (two_factor | one_factor; default
      # two_factor). The one-time-code viewer always stays one_factor.
      EDGE_AUTH_POLICY: ${EDGE_AUTH_POLICY:-two_factor}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?set in .env}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?set in .env}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:?set in .env}
    volumes:
      - ../authelia/configuration.yml:/config/configuration.yml:ro
      - ../authelia/users.yml:/config/users.yml
      - edge-state:/data
      - edge-notify:/notify
    networks:
      default:
    expose:
      - "9091"
    restart: unless-stopped

  # Writes edge-plane's audit events (docs/audit.md): one `auth` event per
  # row of Authelia's authentication log, read from edge-state through a
  # read-only mount and a read-only SQLite connection; one `admin` event per
  # account change in authelia/users.yml; and the `admin` events of the
  # account targets (`make totp`), which run their emitter here with
  # `docker compose exec`. Stdlib Python mounted read-only; nothing is
  # installed. No network: it reads files and writes its stdout.
  auth-audit:
    <<: *hardened
    image: docker.io/library/python:3.12.16-alpine3.24@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    logging: *default-logging
    # The image's `nobody`; auth-audit-init hands it edge-audit-state.
    user: "65534:65534"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=1m
    entrypoint: ["python", "/app/edge_audit.py"]
    command: ["serve"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      AUDIT_OUTPUT: container
      AUDIT_AUTHELIA_DB: /authelia-state/db.sqlite3
      AUDIT_USERS_FILE: /authelia-config/users.yml
      AUDIT_STATE_DIR: /state
      AUDIT_POLL_INTERVAL: ${AUDIT_POLL_INTERVAL:-5}
    volumes:
      - ../audit:/app:ro
      - ../VERSION:/etc/edge-plane/VERSION:ro
      - edge-state:/authelia-state:ro
      # The directory, not the file: an editor that saves by renaming a new
      # file over users.yml would leave a file bind on the old one.
      - ../authelia:/authelia-config:ro
      - edge-audit-state:/state
    depends_on:
      authelia:
        condition: service_healthy
      auth-audit-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/edge_audit.py", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # One-shot, on every `up`: a new volume belongs to root, so hand
  # edge-audit-state to auth-audit's user before it starts. Only CAP_CHOWN.
  auth-audit-init:
    <<: *hardened
    image: docker.io/library/python:3.12.16-alpine3.24@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    logging: *default-logging
    user: "0:0"
    cap_add:
      - CHOWN
    read_only: true
    network_mode: none
    entrypoint: ["chown", "-R", "65534:65534", "/state"]
    volumes:
      - edge-audit-state:/state
    restart: "no"

volumes:
  edge-state:
    external: true
  edge-ca:
    external: true
  # auth-audit's export position (the last exported row). External like the
  # other two, and kept by `make nuke`: a replaced Authelia database is then
  # recorded as such (docs/audit.md).
  edge-audit-state:
    external: true
  # Project-scoped, NOT external — holds only short-lived one-time codes,
  # not durable identity state.
  edge-notify:
