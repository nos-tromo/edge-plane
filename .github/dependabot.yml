version: 2
# Every update waits 7 days after its upstream release before Dependabot
# proposes it, so a compromised or broken release is usually caught upstream
# first. Security updates are exempt and still open immediately. Our own
# nos-tromo/* workflows skip the wait, so a hub release is not held back.
updates:
  # No `docker` ecosystem block — edge-plane is pull-only (Caddy and Authelia
  # are digest-pinned images referenced by compose). It has no Dockerfiles for
  # dependabot to update, and the ecosystem fails the run when it finds
  # nothing.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "nos-tromo/*"
