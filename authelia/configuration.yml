# edge-plane Authelia — file-backed users, SQLite state, filesystem
# notifier. Airgap-clean: no SMTP, no external calls.
# Rendered with X_AUTHELIA_CONFIG_FILTERS=template (EDGE_HOST from env).
---
server:
  address: 'tcp://:9091/auth'

log:
  level: info
  format: json

authentication_backend:
  file:
    path: /config/users.yml
  # Self-service password change via the settings UI (/auth/settings).
  password_change:
    disable: false
  # Reset needs the notifier; ours is the filesystem notifier (airgap), so
  # the built-in "forgot password" flow would dead-end in a file only
  # operators read. Resets are admin-mediated instead (README §User accounts).
  password_reset:
    disable: true

access_control:
  default_policy: deny
  rules:
    # Grafana is operator tooling: admins group only. Subject is part of
    # a rule's MATCH criteria — a non-admin simply skips the first rule —
    # so the explicit deny below is what actually blocks everyone else.
    # Order matters: first match wins.
    - domain: '{{ env "EDGE_HOST" }}'
      resources:
        - '^/grafana(/|$)'
      subject: 'group:admins'
      policy: one_factor
    - domain: '{{ env "EDGE_HOST" }}'
      resources:
        - '^/grafana(/|$)'
      policy: deny
    - domain: '{{ env "EDGE_HOST" }}'
      policy: one_factor

session:
  name: authelia_session
  same_site: lax
  # Defaults would be 1h expiration / 5min inactivity — the cause of the
  # pre-v0.3 frequent-logout complaints. Working-day session, meal-proof
  # inactivity window, vacation-proof remember-me.
  expiration: 12h
  inactivity: 4h
  remember_me: 2M
  cookies:
    - domain: '{{ env "EDGE_HOST" }}'
      authelia_url: 'https://{{ env "EDGE_HOST" }}/auth'
      default_redirection_url: 'https://{{ env "EDGE_HOST" }}/'

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
