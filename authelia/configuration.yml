# edge-plane Authelia — file-backed users, SQLite state, filesystem
# notifier. Airgap-clean: no SMTP, no external calls.
# Rendered with X_AUTHELIA_CONFIG_FILTERS=template (EDGE_HOST from env).
---
server:
  address: 'tcp://:9091/auth'

log:
  level: info
  format: json

authentication_backend:
  file:
    path: /config/users.yml
    watch: true
  # Self-service password change via the settings UI (/auth/settings).
  password_change:
    disable: false
  # Reset needs the notifier; ours is the filesystem notifier (airgap), so
  # the built-in "forgot password" flow would dead-end in a file only
  # operators read. Resets are admin-mediated instead (docs/user-accounts.md).
  password_reset:
    disable: true

access_control:
  default_policy: deny
  rules:
    # Resource patterns are case-insensitive ((?i)) because Caddy's path
    # matcher is: without it, /Grafana/ is routed to Grafana by Caddy but
    # skips the Grafana rules here. (Dot segments, encoded characters and
    # repeated slashes need no such care: Authelia normalizes the path
    # before matching.) Order matters: first match wins.
    #
    # There is deliberately no one_factor exception, not even for the
    # /auth-code viewer: a one-time code read with just the password is
    # enough to elevate a session and replace the user's second factor.
    # Second factors are therefore provisioned by an admin (`make totp`,
    # docs/user-accounts.md), never enrolled through the portal.
    # Grafana is operator tooling: admins group only. Subject is part of
    # a rule's MATCH criteria — a non-admin simply skips the first rule —
    # so the explicit deny below is what actually blocks everyone else.
    - domain: '{{ env "EDGE_HOST" }}'
      resources:
        - '(?i)^/grafana(/|$)'
      subject: 'group:admins'
      policy: '{{ env "EDGE_AUTH_POLICY" | default "two_factor" }}'
    - domain: '{{ env "EDGE_HOST" }}'
      resources:
        - '(?i)^/grafana(/|$)'
      policy: deny
    # Everything else: password plus a second factor (TOTP; works without
    # network access). EDGE_AUTH_POLICY=one_factor is the escape hatch for
    # dev hosts.
    - domain: '{{ env "EDGE_HOST" }}'
      policy: '{{ env "EDGE_AUTH_POLICY" | default "two_factor" }}'

# Elevating a session (needed to register or remove a second-factor device,
# and for the portal's password change) asks for the second factor too, once
# the user has one. Defence in depth only: measured on this version, a
# session holding just the password plus the one-time code could still
# elevate and replace the device, which is why /auth-code is not one_factor.
identity_validation:
  elevated_session:
    require_second_factor: true

session:
  name: authelia_session
  same_site: lax
  # Defaults would be 1h expiration / 5min inactivity — the cause of the
  # pre-v0.3 frequent-logout complaints. Working-day session, meal-proof
  # inactivity window, vacation-proof remember-me. Overridable per host
  # via EDGE_SESSION_* in .env (see docs/configuration.md).
  expiration: '{{ env "EDGE_SESSION_EXPIRATION" | default "12h" }}'
  inactivity: '{{ env "EDGE_SESSION_INACTIVITY" | default "4h" }}'
  remember_me: '{{ env "EDGE_SESSION_REMEMBER_ME" | default "2M" }}'
  cookies:
    - domain: '{{ env "EDGE_HOST" }}'
      authelia_url: 'https://{{ env "EDGE_HOST" }}/auth'
      default_redirection_url: 'https://{{ env "EDGE_HOST" }}/'

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /notify/notification.txt
